name: create-docker.yml
on:
  push:
    branches:
      - master
      - testing
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Gradle wrapper validation
      uses: gradle/actions/wrapper-validation@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        registry: registry.carp.dk
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Get tag
      id: tag
      run: |
          BRANCH="${GITHUB_REF##*/}"
          if [[ "$BRANCH" == "develop" ]]; then
            echo "TAG=development" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "testing" ]]; then
            echo "TAG=testing" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "master" ]]; then
            echo "TAG=production" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT
          fi

    - name: Build Docker image
      run: |
        docker build -t registry.carp.dk/carp/carp-ws:${{ steps.tag.outputs.TAG }} .
        docker push registry.carp.dk/carp/carp-ws:${{ steps.tag.outputs.TAG }}

