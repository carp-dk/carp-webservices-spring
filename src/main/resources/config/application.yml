server:
  port: "${CAWS_PORT}"
  max-http-request-header-size: 48KB
  tomcat:
    uri-encoding: UTF-8
  forward-headers-strategy: native

spring:
  application:
    name: carp-webservices
    version: 2.5.0
  servlet:
    multipart:
      enabled: true
      max-file-size: 30MB
      max-request-size: 30MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  output:
    ansi:
      enabled: always

  datasource:
    name: "carp_${PROFILE}"
    url: "jdbc:postgresql://${PG_HOST}:${PG_PORT}/carp?serverTimezone=UTC&characterEncoding=utf-8"
    username: "${ADMIN_USER}"
    password: "${ADMIN_PASSWORD}"
    driver-class-name: org.postgresql.Driver

    # HikariCP settings
    # https://github.com/brettwooldridge/HikariCP#configuration-knobs-baby
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      driver-class-name: org.postgresql.Driver
      # This pool shares one Postgres (max_connections=100) with Keycloak, whose pool is capped at 50
      # in docker-compose, so together the two apps can hold at most 20 + 50 = 70 of the 100 slots.
      # Both connect as the Postgres superuser, so the superuser-reserved slots are NOT a protected
      # admin reserve here; the remaining ~30 are plain headroom. Re-check this budget before raising.
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 5
      connection-timeout: 30000
      leak-detection-threshold: 30000
      pool-name: CarpHikariCP

  jpa:
    properties:
      hibernate:
        types:
          print:
            banner: false
        jdbc:
          lob:
            non_contextual_creation: true
    generate-ddl: false
    open-in-view: false

  sql:
    init:
      mode: always

  rabbitmq:
    host: "${RABBIT_HOST}"
    port: "${RABBIT_PORT}"
    username: "${ADMIN_USER}"
    password: "${ADMIN_PASSWORD}"
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1s
          max-retries: 3
          max-interval: 10s
          multiplier: 3

  mail:
    host: "${MAIL_HOST}"
    port: "${MAIL_PORT}"
    username: "${MAIL_USERNAME}"
    password: "${MAIL_PASSWORD}"
    from: "${MAIL_FROM} <${MAIL_FROM_ADDRESS}>"
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
      mail.transport.protocol: smtp
      mail.smtp.connectiontimeout: 60000
      mail.smtp.timeout: 60000
      mail.smtp.writetimeout: 60000

  messages:
    basename: messages/messages
    encoding: UTF-8

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
    cache: true

  main:
    banner-mode: off

  flyway:
    enabled: true

  jackson:
    default-property-inclusion: NON_NULL

keycloak:
  auth-server-url: "${KC_URL}"
  realm: Carp
  admin:
    client-id: "${KC_CLIENT_ID}"
    client-secret: "${KC_CLIENT_SECRET}"
    # Bounds on the Keycloak Admin API HTTP calls. Keycloak is co-located, so these catch a hung/
    # overloaded Keycloak rather than enforce a latency budget. The bulk anonymous-accounts endpoint
    # streams a long NDJSON response; its timeout is a last-resort cleanup, not an operational limit.
    connect-timeout: 2s
    response-timeout: 30s
    bulk-response-timeout: 2d
  # Timeouts for the JWKS fetch used to validate JWTs. Spring Security 7 defaults these to
  # 500 ms, which caused sporadic RemoteKeySourceException "Read timed out" 500s on the first
  # request after startup and on each JWKS cache refresh while Keycloak was slow.
  jwks:
    connect-timeout: 5s
    read-timeout: 5s

com:
  c4-soft:
    springaddons:
      oidc:
        resourceserver:
          permit-all:
          - /actuator/**
          - /swagger-ui/**
          - /v3/api-docs/**
          - /doc/**
        ops:
          - iss: ${keycloak.auth-server-url}/realms/${keycloak.realm}
            username-claim: preferred_username
            authorities:
            - path: $.realm_access.roles
              prefix: ROLE_
              caze: upper
            - path: $.manage_study
              prefix: manage_study_
            - path: $.limited_manage_study
              prefix: limited_manage_study_
            - path: $.in_deployment
              prefix: in_deployment_
            - path: $.protocol_owner
              prefix: protocol_owner_
            - path: $.file_owner
              prefix: file_owner_
            - path: $.consent_owner
              prefix: consent_owner_
            - path: $.collection_owner
              prefix: collection_owner_

springdoc:
  api-docs:
    path: /doc/v3/api-docs
  swagger-ui:
    path: /doc/
    default-model-rendering: model
    oauth:
      client-id: "${KC_CLIENT_ID}"
      client-secret: "${KC_CLIENT_SECRET}"
      scopes: openid profile email carp
      realm: ${keycloak.realm}
  # TODO: Kotlin support is broken due to incompability between springdoc-openapi, spring-boot 3.5.x and kotlin 1.9.x,
  # enable kotlin support once kotlin 2 is used
  enable-kotlin: false

rabbit:
  email:
    sending:
      queue: email-sending-queue-${spring.profiles.active}
      direct-ex: email-sending-direct-exchange-${spring.profiles.active}
      dlq: ${rabbit.email.sending.queue}.dlq
      dlx: ${rabbit.email.sending.queue}.dlx
      plq: ${rabbit.email.sending.queue}.plq
      plx: ${rabbit.email.sending.queue}.plx

  study:
    queue: study-queue-${spring.profiles.active}
    direct-ex: study-direct-exchange-${spring.profiles.active}
    dlq: ${rabbit.study.queue}.dlq
    dlx: ${rabbit.study.queue}.dlx

  deployment:
    queue: deployment-queue-${spring.profiles.active}
    direct-ex: deployment-direct-exchange-${spring.profiles.active}
    dlq: ${rabbit.deployment.queue}.dlq
    dlx: ${rabbit.deployment.queue}.dlx

# s3 settings for image storage
# Future versions of CARP will ship with a self-hosted s3 container
s3:
  space:
    key: "${S3_KEY}"
    secret: "${S3_SECRET}"
    endpoint: "${S3_ENDPOINT}"
    bucket: "${S3_BUCKET}"
    region: "${S3_REGION}"

management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "prometheus", "metrics"]
  endpoint:
    health:
      cache:
        time-to-live: 5000
      show-details: always

  info:
    build:
      enabled: true
    defaults:
      enabled: true
    env:
      enabled: true

  health:
    defaults:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true

logging:
  level:
    org.hibernate.sql: INFO
    com.zaxxer.hikari.HikariConfig: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
    org.keycloak: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

teams:
  webhook:
    # Each channel is optional: leave its env var unset to disable notifications for that channel.
    server: "${TEAMS_SERVER_WEBHOOK_URL:}"
    client: "${TEAMS_CLIENT_WEBHOOK_URL:}"
    heartbeat: "${TEAMS_HEARTBEAT_WEBHOOK_URL:}"
    dev: "${TEAMS_DEV_WEBHOOK_URL:}"

storage:
  directory: /home/carp/storage/${spring.profiles.active}/

cleanup:
  exports:
    retention-days: "${EXPORTS_RETENTION_DAYS:7}"
  anonymous-accounts:
    cron: "${ANONYMOUS_CLEANUP_CRON:0 30 3 * * ?}"
    # Hard cap on accounts actually deleted per run (enforced down to the individual request), so a large
    # study is spread over several runs rather than triggering an unbounded burst of Keycloak deletions.
    max-accounts-per-run: "${ANONYMOUS_CLEANUP_MAX_ACCOUNTS_PER_RUN:1000000}"
    # Max accounts deleted per request to the extension; a study is swept over several such calls.
    per-request-limit: "${ANONYMOUS_CLEANUP_PER_REQUEST_LIMIT:10000}"
    max-studies-per-scan: "${ANONYMOUS_CLEANUP_MAX_STUDIES_PER_SCAN:500}"

environment:
  url: "${CAWS_URL}"
  portalUrl: "${CAWS_PORTAL_URL}"
  keycloak-url: "${KC_URL}"
  keycloak-realm: "${keycloak.realm}"

alert:
  # The email address to send alerts to
  admin-email: "${CAWS_ADMIN_EMAIL}"
  subject: WARNING! DATABASE CONNECTION PROBLEMS!

info:
  app:
    name: ${spring.application.name}
    description: This is CARP Webservices API.
    version: ${spring.application.version}
    java:
      version: 21
    environment: ${spring.profiles.active}
